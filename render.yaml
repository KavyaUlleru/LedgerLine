services:
  # Backend API Web Service
  - type: web
    name: ledgerline-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ledgerline-db
          property: connectionString

  # Frontend Static Site
  - type: static_site
    name: ledgerline-frontend
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: ledgerline-backend
          property: host
        value: https://${host}/api

databases:
  # Managed PostgreSQL Database
  - name: ledgerline-db
    plan: free
    databaseName: ledgerline
    user: postgres

